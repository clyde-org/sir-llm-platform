# Prometheus/Grafana installation for Qwen3-8B LLM Stack
# Installs kube-prometheus-stack in monitoring namespace

namespaceOverride: monitoring

prometheus:
  enabled: true
  service:
    type: NodePort
    port: 9090
    nodePort: 30900
  podMonitor:
    # PodMonitors for vLLM and router
    enabled: true
  serviceMonitor:
    enabled: true
  # Prometheus scrape configs
  prometheusSpec:
    retention: 15d
    retentionSize: 10GiB
    storageSpec:
      emptyDir: {}
    # Scrape interval
    scrapeInterval: 15s
    scrapeTimeout: 10s
    # NOTE: no additionalScrapeConfigs here. vLLM / router / LiteLLM are scraped by the
    # PodMonitors in monitoring/servicemonitors.yaml (labeled release: prometheus).
    # Raw scrape jobs were previously defined here but produced ZERO targets: the
    # label regexes matched app=vllm / app=litellm while the pods are actually labeled
    # app=vllm-qwen3-8b / app=litellm-proxy (relabel regexes are fully anchored).
    # They also risked double-scraping the router. If you need the vLLM wrapper thread
    # endpoint (:9101, metric vllm_threads), add a second podMetricsEndpoint with
    # port: vllmthr to the vllm-metrics PodMonitor instead.

alertmanager:
  enabled: false

grafana:
  enabled: true
  service:
    type: NodePort
    port: 3000
    nodePort: 30300
  adminPassword: "prometheus-admin"
  persistence:
    enabled: false
    storageClassName: standard
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

# Import existing dashboards if available
extraVolumes:
  - name: grafana-dashboards
    configMap:
      name: grafana-dashboards
      defaultMode: 420

extraVolumeMounts:
  - name: grafana-dashboards
    mountPath: /var/lib/grafana/dashboards/default
    configMap: grafana-dashboards

# Disable default alerts - we may add custom ones
defaultRules:
  enabled: true
  rules:
    # Disable Kubernetes system alerts that may be noisy
    alertmanager: false
    etcd: false
    configReloaders: false
    k8s: false
    k8sAddons: false

# Enable kubelet metrics
kubelet:
  enabled: true
  serviceMonitor:
    self: true

# Enable apiserver metrics
kubeApiServer:
  enabled: true
  serviceMonitor:
    self: true

# Enable controller manager metrics
kubeControllerManager:
  enabled: false

# Enable scheduler metrics
kubeScheduler:
  enabled: false

# Enable etcd metrics
kubeEtcd:
  enabled: false

# Enable coreDNS metrics
kubeDns:
  enabled: false

# Enable node metrics
nodeExporter:
  enabled: true
  service:
    type: ClusterIP