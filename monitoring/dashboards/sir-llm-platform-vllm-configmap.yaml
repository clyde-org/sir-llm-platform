# Provisioned Grafana dashboard for the sir-llm-platform deployment.
#
# The Grafana pod runs a kiwigrid/k8s-sidecar (container grafana-sc-dashboard)
# that watches for ConfigMaps labeled `grafana_dashboard: "1"` and copies them
# into /tmp/dashboards, which the `sidecarProvider` file provider loads.
# Because grafana.persistence is disabled, this ConfigMap is the durable source
# of the dashboard -- it survives pod restarts and is editable only via the file
# (the sidecar provider is read-only in the UI).
#
# Apply with:
#   kubectl apply -f monitoring/dashboards/sir-llm-platform-vllm-configmap.yaml
#
# The dashboard JSON itself lives at monitoring/dashboards/sir-llm-platform-vllm.json
# and must be kept in sync with the data value below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sir-llm-platform-vllm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: sir-llm-platform-vllm-dashboard
