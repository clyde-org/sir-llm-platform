# ServiceMonitors for scraping vLLM, Router, LiteLLM, and NPU metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      component: vllm
  namespaceSelector:
    matchNames:
      - sir-llm-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: router-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: router
  namespaceSelector:
    matchNames:
      - sir-llm-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# Note: LiteLLM metrics require network-level access to internal cluster IPs.
# If the corporate proxy is blocking traffic, LiteLLM metrics will not work.
# Current working metrics: vLLM, Router, NPU Exporter
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: litellm-proxy
  namespaceSelector:
    matchNames:
      - sir-llm-platform
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: npu-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: npu-exporter
  namespaceSelector:
    matchNames:
      - npu-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s