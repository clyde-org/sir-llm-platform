# Template — sir-llm-platform benchmark (llm-la-icbc harness).
# Placeholders: __MODEL__ __RATE__ __TAG__ __NODE_IP__ (substituted by make-ramp-configs.sh;
# __NODE_IP__ comes from the NODE_IP env var).
# Full path exercised: client -> LiteLLM :30400 (NodePort) -> kv-router -> vLLM.
#
# CodeFlowBench single-turn (competitive programming problems, input ~300-900
# tokens). Poisson open-loop arrivals at __RATE__ rps for 180 s.

backend: "litellm"

router_url: "http://__NODE_IP__:30400"
total_requests: 20000
prompt_source: "codeflow"

hf_lmsys:
  dataset_name: "/mnt/data/datasets/codeflowbench"
  tokenizer_name: "/mnt/data/models/Qwen3-14B"
  min_input_tokens: 256
  multi_turn: false
  seed: 42

load_pattern:
  pattern: "poisson"
  rate_rps: __RATE__
  duration_s: 180.0
  warmup_reqs: 5

generation:
  max_tokens: 1024
  temperature: 0.0
  length_mode: "legacy"
  ignore_eos: true
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: false

transport:
  mode: "sync"
  submit_path: "/submit"
  results_zmq: ""
  topic: "results"
  idle_timeout_s: 7200.0
  idle_zero_running_s: 30.0

litellm:
  base_url: "http://__NODE_IP__:30400"
  chat_path: "/v1/chat/completions"
  model: "__MODEL__"
  api_key: "YOUR-API-KEY"
  timeout_s: 7200.0
  stream: true

experiments_root: "/mnt/data/experiments"
