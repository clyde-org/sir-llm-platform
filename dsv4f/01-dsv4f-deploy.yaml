# DeepSeek-V4-Flash single-node serving on node3 (8x 910B3, 64GB each).
# Official A2 recipe from vllm-ascend v0.30.0rc2 tutorial (DeepSeek-V4-Flash.md
# section 5.1, A2 series, MTP variant): TP8, DP1, block-size 128, int8 indexer
# KV, MTP spec-decode (1 token), 133k context.
#
# Image: v0.30.0rc2-openeuler (hand-imported, proven on our nodes).
# Quantization: left to auto-detect. The checkpoint declares quant_method=fp8
# and model_type=deepseek_v4, which vLLM's override logic routes to the
# deepseek_v4_fp8 config (core supported path, ds_linear 128x128 dense +
# ds_w4a8_moe MXFP4 experts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-v4-flash
  namespace: sir-llm-platform
  labels:
    app: deepseek-v4-flash
    model: deepseek-v4-flash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepseek-v4-flash
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: deepseek-v4-flash
        model: deepseek-v4-flash
        owner: sheriffo
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: node3
      containers:
        - name: vllm
          image: quay.io/ascend/vllm-ascend:nightly-releases-v0.30.0-openeuler
          imagePullPolicy: Never
          command: ["/bin/sh", "/dsv4f-patch/boot.sh"]
          args:
            - vllm
            - serve
            - /model
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "133120"
            - --max-num-batched-tokens
            - "8192"
            - --served-model-name
            - deepseek-v4-flash,dsv4
            - --gpu-memory-utilization
            - "0.9"
            - --max-num-seqs
            - "32"
            - --data-parallel-size
            - "1"
            - --tensor-parallel-size
            - "8"
            - --enable-expert-parallel
            - --tokenizer-mode
            - deepseek_v4
            - --tool-call-parser
            - deepseek_v4
            - --enable-auto-tool-choice
            - --reasoning-parser
            - deepseek_v4
            - --no-enable-prefix-caching
            - --block-size
            - "128"
            - --attention_config.indexer_kv_dtype
            - int8
            - --speculative-config
            - '{"num_speculative_tokens":1,"method":"mtp","enforce_eager":true}'
            - --compilation-config
            - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
            - --additional-config
            - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":false,"enable_dsa_cp":true}'
          env:
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            - name: OMP_PROC_BIND
              value: "false"
            - name: OMP_NUM_THREADS
              value: "10"
            - name: PYTORCH_NPU_ALLOC_CONF
              value: expandable_segments:True
            - name: HCCL_BUFFSIZE
              value: "1024"
            - name: TASK_QUEUE_ENABLE
              value: "1"
            - name: HCCL_OP_EXPANSION_MODE
              value: AIV
            - name: HCCL_IF_IP
              value: "10.50.156.65"
            - name: GLOO_SOCKET_IFNAME
              value: "enp189s0f0"
            - name: TP_SOCKET_IFNAME
              value: "enp189s0f0"
            - name: HCCL_SOCKET_IFNAME
              value: "enp189s0f0"
            - name: ASCEND_RT_VISIBLE_DEVICES
              value: "0,1,2,3,4,5,6,7"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 100
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 900
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "32"
              memory: "100Gi"
            limits:
              huawei.com/Ascend910: "8"
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: dsv4f-patch
              mountPath: /dsv4f-patch
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: dcmi
              mountPath: /usr/local/dcmi
            - name: npu-smi
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: driver-version-info
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info
              mountPath: /etc/ascend_install.info
            - name: cache
              mountPath: /root/.cache
            - name: hisi-hdc
              mountPath: /dev/hisi_hdc
            - name: devmm-svm
              mountPath: /dev/devmm_svm
            - name: hccn-conf
              mountPath: /etc/hccn.conf
              readOnly: true
      volumes:
        - name: model
          hostPath:
            path: /data/models/DeepSeek-V4-Flash
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Gi
        - name: dcmi
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: driver-version-info
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        - name: hisi-hdc
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
        - name: hccn-conf
          hostPath:
            path: /etc/hccn.conf
            type: File
        - name: dsv4f-patch
          configMap:
            name: dsv4f-patch
            defaultMode: 0555
# ConfigMap 'dsv4f-patch' is managed separately (contains code; created via
# kubectl create configmap --from-file, see dsv4f/Makefile notes in plan doc).

