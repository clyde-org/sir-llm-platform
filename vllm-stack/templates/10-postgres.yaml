{{- if and .Values.postgres.enabled .Values.litellm.enabled }}
# ---------------------------------------------------------------------------
# Postgres for LiteLLM: admin UI + persistent request/spend logs + virtual
# keys. Pinned to the control-plane node (same as redis/router/litellm).
#
# Why: the LiteLLM admin UI (http://<node>:30400/ui — login `admin` /
# master key) hard-requires a database. The login handler upserts the admin
# user row and mints a UI session API key, both of which hit Postgres;
# without DATABASE_URL it fails with "Authentication Error, Not connected
# to DB!". The proxy's own Prisma migrations (prisma db push) run at proxy
# startup — no manual migration step.
#
# Storage: this cluster has no StorageClass — volumes are static local PVs
# (same pattern as the open-webui-data PV). The PV below is bound 1:1 to the
# PVC via claimRef and pinned to the control-plane node. ONE-TIME manual
# step on that node before the pod first mounts (local PVs do not create
# the directory):
#   mkdir -p {{ .Values.postgres.storage.path }}
#
# The litellm pod reads DATABASE_URL from the litellm-db-creds secret below.
# Both deployments carry a checksum of the credential values, so changing
# postgres.{user,password,database,port} rolls exactly what needs rolling.
#
# NOTE: general_settings already sets allow_requests_on_db_unavailable:
# false, so while Postgres is down the proxy REFUSES LLM requests rather
# than serving without spend tracking.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: litellm-db-creds
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: {{ .Values.postgres.serviceName }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s.%s:%v/%s" .Values.postgres.user .Values.postgres.password .Values.postgres.serviceName (include "vllm-stack.namespace" .) .Values.postgres.port .Values.postgres.database | quote }}
{{- if .Values.pin.enabled }}
---
# Static local PV (no StorageClass in this cluster). Node-affinity matches
# the control-plane pin so the claim can only bind where the path lives.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.postgres.serviceName }}-pv
  labels:
    sir-llm-platform: litellm-db
spec:
  capacity:
    storage: {{ .Values.postgres.storage.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: {{ .Values.postgres.storage.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "kubernetes.io/hostname"
              operator: In
              values:
                - {{ .Values.pin.nodeName | quote }}
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: {{ .Values.postgres.serviceName }}-data
    namespace: {{ include "vllm-stack.namespace" . }}
  # Re-provisioning caveat: after the PVC is deleted, the Retain PV stays
  # phase=Released; re-bind manually before a new PVC can claim it:
  #   kubectl patch pv {{ .Values.postgres.serviceName }}-pv -p '{"spec":{"claimRef":null,"phase":"Available"}}'
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.serviceName }}-data
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: {{ .Values.postgres.serviceName }}
    release: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: {{ .Values.postgres.serviceName }}
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.postgres.serviceName }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgres.serviceName }}
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: {{ .Values.postgres.serviceName }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate    # ReadWriteOnce local PV: never run two pods against one volume
  selector:
    matchLabels:
      app: {{ .Values.postgres.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.postgres.serviceName }}
        release: {{ .Release.Name }}
      annotations:
        # Roll the pod when credentials change (secret is not volume-mounted).
        checksum/db-creds: {{ tuple .Values.postgres.user .Values.postgres.password .Values.postgres.database .Values.postgres.port | toYaml | sha256sum }}
    spec:
{{ include "vllm-stack.nodePin" . | indent 6 }}
{{ include "vllm-stack.tolerations" . | indent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: litellm-db-creds
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db-creds
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: litellm-db-creds
                  key: POSTGRES_DB
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
              memory: {{ .Values.postgres.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
              memory: {{ .Values.postgres.resources.limits.memory | quote }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgres.serviceName }}-data
{{- end }}
