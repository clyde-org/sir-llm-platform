{{- define "vllm-stack.namespace" -}}
{{ .Values.namespace | default "llm-gateway" }}
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-router-sa
  namespace: {{ include "vllm-stack.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-router
  namespace: {{ include "vllm-stack.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-router
  namespace: {{ include "vllm-stack.namespace" . }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-router
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-router-sa
    namespace: {{ include "vllm-stack.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-router
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: router
    app.kubernetes.io/name: vllm-stack
    app.kubernetes.io/component: router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      serviceAccountName: {{ .Release.Name }}-router-sa
      containers:
        - name: router
          image: {{ .Values.images.vllm }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.router.port }}
              name: http
          env:
            - name: REDIS_HOST
              value: {{ .Release.Name }}-redis
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: VLLM_HOST
              value: {{ .Release.Name }}-vllm
            - name: VLLM_PORT
              value: {{ .Values.vllm.port | quote }}
            - name: LD_LIBRARY_PATH
              value: "/usr/local/Ascend/cann-8.5.2/aarch64-linux/lib64/device/lib64:/usr/local/Ascend/cann-8.5.2/aarch64-linux/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver/lib64/inner:/usr/local/lib:/usr/lib64:/lib:/lib64"
            - name: KV_AWARE
              value: {{ .Values.router.kvAware | quote }}
            - name: LEN_AWARE
              value: {{ .Values.router.lenAware | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.servedName | quote }}
          command:
            - python3
            - -m
            - vllm.router
          args:
            - "--host=0.0.0.0"
            - "--port={{ .Values.router.port }}"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.router.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.router.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: ascend-cann
              mountPath: /usr/local/Ascend/cann-8.5.2
            - name: ascend-driver
              mountPath: /usr/local/Ascend/driver
      volumes:
        - name: ascend-cann
          hostPath:
            path: /usr/local/Ascend/cann-8.5.2
        - name: ascend-driver
          hostPath:
            path: /usr/local/Ascend/driver
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-router
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: router
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.router.port }}
      targetPort: {{ .Values.router.port }}
      name: http
  selector:
    app: router