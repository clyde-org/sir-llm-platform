{{- if .Values.litellm.enabled }}
# ---------------------------------------------------------------------------
# LiteLLM proxy: API gateway (auth + spend tracking). Pinned to the control-plane
# node. Config is mounted from the litellm-config ConfigMap.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.litellm.serviceName }}
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: {{ .Values.litellm.serviceName }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.litellm.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.litellm.serviceName }}
        release: {{ .Release.Name }}
    spec:
{{ include "vllm-stack.nodePin" . | indent 6 }}
{{ include "vllm-stack.tolerations" . | indent 6 }}
      containers:
        - name: litellm
          image: {{ .Values.images.litellm }}
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/litellm_config.yaml
            - --port
            - {{ .Values.litellm.port | quote }}
{{- if .Values.litellm.detailedDebug }}
            - --detailed_debug
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.litellm.port }}
              protocol: TCP
          volumeMounts:
            - name: litellm-config
              mountPath: /app/litellm_config.yaml
              subPath: litellm_config.yaml
          # LiteLLM takes ~17s to initialize; 60s delay avoids premature kill.
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: {{ .Values.litellm.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: {{ .Values.litellm.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            # Suppress telemetry back to litellm.ai
            - name: LITELLM_TELEMETRY
              value: "False"
            - name: NO_PROXY
              value: "{{ .Values.litellm.serviceName }}.{{ include "vllm-stack.namespace" . }},{{ include "vllm-stack.namespace" . }},localhost,127.0.0.1,no_proxy={{ .Values.litellm.serviceName }}.{{ include "vllm-stack.namespace" . }},{{ include "vllm-stack.namespace" . }},localhost,127.0.0.1"
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.litellm.serviceName }}
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: {{ .Values.litellm.serviceName }}
    release: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.litellm.serviceName }}
  ports:
    - name: http
      port: {{ .Values.litellm.port }}
      targetPort: {{ .Values.litellm.port }}
      nodePort: {{ .Values.litellm.nodePort }}
{{- end }}
