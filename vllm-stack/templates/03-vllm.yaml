{{- define "vllm-stack.namespace" -}}
{{ .Values.namespace | default "llm-gateway" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm-{{ .Values.model.name }}
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: vllm
    model: {{ .Values.model.name }}
    app.kubernetes.io/name: vllm-stack
    app.kubernetes.io/component: vllm
spec:
  replicas: {{ .Values.model.replicas }}
  selector:
    matchLabels:
      app: vllm
      model: {{ .Values.model.name }}
  template:
    metadata:
      labels:
        app: vllm
        model: {{ .Values.model.name }}
        component: vllm
    spec:
      nodeSelector:
        {{- range $key, $value := .Values.nodeSelector }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: {{ .Values.images.vllm }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.vllm.port }}
              name: http
          env:
            - name: HCCL_CONNECT_TIMEOUT
              value: "1800"
            - name: HCCL_NPU_SOCKET_PORT_RANGE
              value: "16660-16670"
            - name: LD_LIBRARY_PATH
              value: "/usr/local/Ascend/cann-8.5.2/aarch64-linux/lib64/device/lib64:/usr/local/Ascend/cann-8.5.2/aarch64-linux/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver/lib64/inner:/usr/local/lib:/usr/lib64:/lib:/lib64"
            - name: MODEL_NAME
              value: {{ .Values.model.servedName | quote }}
            - name: MODEL_PATH
              value: /models/{{ .Values.model.path }}
            - name: MAX_MODEL_LEN
              value: {{ .Values.model.maxModelLen | quote }}
            - name: TP_SIZE
              value: {{ .Values.model.tensorParallelSize | quote }}
            - name: ASCEND_CUSTOM_LOG_PATH
              value: "/home/builduser/log"
            - name: ASCEND_RT_AICPU_TIMEOUT
              value: "1800"
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - "--model=/models/{{ .Values.model.path }}"
            - "--served-model-name={{ .Values.model.servedName }}"
            - "--tensor-parallel-size={{ .Values.model.tensorParallelSize }}"
            - "--max-model-len={{ .Values.model.maxModelLen }}"
            - "--gpu-memory-utilization={{ .Values.vllm.gpuMemoryUtilization }}"
            - "--trust-remote-code"
            - "--host=0.0.0.0"
            - "--port={{ .Values.vllm.port }}"
          resources:
            limits:
              memory: "64Gi"
            requests:
              memory: "32Gi"
          volumeMounts:
            - name: model-path
              mountPath: /models
            - name: ascend-cann
              mountPath: /usr/local/Ascend/cann-8.5.2
            - name: ascend-driver
              mountPath: /usr/local/Ascend/driver
      volumes:
        - name: model-path
          hostPath:
            path: /data/models
        - name: ascend-cann
          hostPath:
            path: /usr/local/Ascend/cann-8.5.2
        - name: ascend-driver
          hostPath:
            path: /usr/local/Ascend/driver
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    app: vllm
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.vllm.port }}
      targetPort: {{ .Values.vllm.port }}
      name: http
  selector:
    app: vllm