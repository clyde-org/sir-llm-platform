# Presentation — Qwen2.5-7B + Qwen2.5-14B timeshare on Ascend NPU (TP=1)
#
# Based on llm-la values-presentation-dual-model.yaml, adapted for:
#   - node devserver-bms-d9a5373f-tmp0306 (same as original)
#   - mount mode on NPUs 2 and 3 (hostPath /dev/davinci* + ASCEND_RT)
#   - vllm-ascend HBM image (hbm_server + wake_up_lazy)
#
# Architecture:
#   TWO pods (cards 2 + 3), each:
#     [ vLLM container (7B + 14B background processes, 1 NPU) ]
#     + [ ONE kv-sidecar (MODELS_JSON, SCHED_ENABLED, drain->sleep->wake) ]
#   + router (SCHED_ENABLED decide_pull) + redis (no LiteLLM)
#
# NPU wiring: mode mount — hostPath /dev/davinci* + ASCEND_RT from ascendDevices.
# Physical cards 0–7; two groups pin card 2 and card 3. vLLM/CANN uses runtime
# index 0 when only one card is visible.
#
# Install (from sir-llm-platform repo root, on the target cluster):
#   helm upgrade --install vllm-presentation ./vllm-stack \
#     -n vllm-metrics-experiment --create-namespace \
#     -f vllm-stack/values/values-presentation-dual-model-device-plugin.yaml \
#     --timeout 60m --wait
#
# Phase 1 (vLLM only): --set deploy.router=false --set sidecar.enabled=false
#
# NodePorts (portOffset 400): router 30480, redis 30479;
# vLLM card2 31021/31022, card3 31031/31032.

# Namespace: vllm-metrics-experiment (pass via helm -n)
namespace: vllm-metrics-experiment
global:
  imageRegistry: ghcr.io/clyde-org/llm-la-icbc

portOffset: 400

pin:
  enabled: true
  nodeName: devserver-bms-d9a5373f-tmp0306

deploy:
  vllm: true
  router: true
  redis: true

backend: router

sidecar:
  enabled: true
  mode: merged
  imagePullPolicy: Always
  wakeMode: wake_up_lazy
  streamingMode: true
  sourceMount:
    enabled: true
    hostPath: /home/EulerX/gbw/2012_presentation
    mountPath: /sidecar-src

scheduler:
  enabled: true
  log: summary
  defaultSloS: 60
  cooldownS: 5
  tIdleS: 5
  sleepLevel: 1

modelVolume:
  create: false
  hostPath: /mnt_data
  # HBM image writes merged weights to {model}/dense-tp{N} at load time —
  # read-only mount fails with errno 30.
  readOnly: false

images:
  redis: docker.io/library/redis:7-alpine
  vllm: quay.io/ascend/vllm-ascend:v0.18.0-openeuler-hbm
  router: kv-router:cd72006
  sidecar: kv-sidecar:cd72006

hbmServer:
  enabled: true
  dir: /home/EulerX/gbw/hbm_server/server
  hostPath: /home/EulerX/gbw/hbm_server
  arg: "0"
  condaSh: ""
  logPath: /var/log/hbm_server.log
  readyFallbackS: 5

router:
  mode: pull
  imagePullPolicy: Always
  kvAware: false
  sloAware: false
  affinityEnabled: false
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6

litellm:
  enabled: false

timeshare:
  enabled: true
  groups:
    # Card 2 — dual-model timeshare pod (7B + 14B on this NPU).
    - name: presentation-npu2
      replicas: 1
      mode: mount
      nodeName: devserver-bms-d9a5373f-tmp0306
      hostIPC: true
      npuCount: 1
      ascendDevices: "2"   # hostPath /dev/davinci2; runtime index 0 inside vLLM
      workerMultiprocMethod: spawn
      extraTolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      serviceType: NodePort
      memoryRequest: "32Gi"
      memoryLimit: "64Gi"
      logMount:
        hostPath: /home/EulerX/gbw/2012_presentation
        mountPath: /home/EulerX/gbw/2012_presentation
      instances:
        - name: qwen25-7b
          servedModelName: qwen2.5-7b
          port: 8701
          nodePort: 31021
          logFile: qwen2.5-7b-npu2.log
          modelSubPath: Qwen2.5-7B-Instruct
          tensorParallelSize: 1
          batchSize: 8
          sleepMode: true
          ascendWeightNzMode: 0
          enforceEager: true
          asyncScheduling: true
          multiprocPipe: true
          additionalConfigJson: '{"enable_cpu_binding":true,"multistream_overlap_shared_expart":true}'
          vllm:
            trustRemoteCode: true
            gpuMemoryUtilization: 0.9
            maxModelLen: 32768
            maxNumBatchedTokens: 2048
            enablePrefixCaching: true
            modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
            maxNumSeqs: 256
        - name: qwen25-14b
          servedModelName: qwen2.5-14b
          port: 8711
          nodePort: 31022
          waitForSleepOf: qwen25-7b
          logFile: qwen2.5-14b-npu2.log
          modelSubPath: Qwen2.5-14B-Instruct
          tensorParallelSize: 1
          batchSize: 8
          sleepMode: true
          ascendWeightNzMode: 0
          enforceEager: true
          asyncScheduling: true
          multiprocPipe: true
          additionalConfigJson: '{"enable_cpu_binding":true,"multistream_overlap_shared_expart":true}'
          vllm:
            trustRemoteCode: true
            gpuMemoryUtilization: 0.9
            maxModelLen: 32768
            maxNumBatchedTokens: 2048
            enablePrefixCaching: true
            modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
            maxNumSeqs: 256

    # Card 3 — second dual-model replica for the router scheduler.
    - name: presentation-npu3
      replicas: 1
      mode: mount
      nodeName: devserver-bms-d9a5373f-tmp0306
      hostIPC: true
      npuCount: 1
      ascendDevices: "3"   # hostPath /dev/davinci3; runtime index 0 inside vLLM
      workerMultiprocMethod: spawn
      extraTolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      serviceType: NodePort
      memoryRequest: "32Gi"
      memoryLimit: "64Gi"
      logMount:
        hostPath: /home/EulerX/gbw/2012_presentation
        mountPath: /home/EulerX/gbw/2012_presentation
      instances:
        - name: qwen25-7b
          servedModelName: qwen2.5-7b
          port: 8701
          nodePort: 31031
          logFile: qwen2.5-7b-npu3.log
          modelSubPath: Qwen2.5-7B-Instruct
          tensorParallelSize: 1
          batchSize: 8
          sleepMode: true
          ascendWeightNzMode: 0
          enforceEager: true
          asyncScheduling: true
          multiprocPipe: true
          additionalConfigJson: '{"enable_cpu_binding":true,"multistream_overlap_shared_expart":true}'
          vllm:
            trustRemoteCode: true
            gpuMemoryUtilization: 0.9
            maxModelLen: 32768
            maxNumBatchedTokens: 2048
            enablePrefixCaching: true
            modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
            maxNumSeqs: 256
        - name: qwen25-14b
          servedModelName: qwen2.5-14b
          port: 8711
          nodePort: 31032
          waitForSleepOf: qwen25-7b
          logFile: qwen2.5-14b-npu3.log
          modelSubPath: Qwen2.5-14B-Instruct
          tensorParallelSize: 1
          batchSize: 8
          sleepMode: true
          ascendWeightNzMode: 0
          enforceEager: true
          asyncScheduling: true
          multiprocPipe: true
          additionalConfigJson: '{"enable_cpu_binding":true,"multistream_overlap_shared_expart":true}'
          vllm:
            trustRemoteCode: true
            gpuMemoryUtilization: 0.9
            maxModelLen: 32768
            maxNumBatchedTokens: 2048
            enablePrefixCaching: true
            modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
            maxNumSeqs: 256
